<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Séminaires MF-IDF</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f8; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Page relais : affiche la web app dans un cadre. Dans un cadre venu d'un autre site,
  Safari n'envoie pas les cookies Google (blocage des cookies tiers),
  ce qui évite le bug des comptes multiples (/macros/u/1/… « Impossible d'ouvrir le fichier »).
  Ne pas ajouter `credentialless` : Chrome ne charge plus alors la web app Apps Script.
  Aucun secret dans cette page. Le jeton personnel arrive dans le fragment de l'adresse (#t=…), que le navigateur
  n'envoie jamais à GitHub : il n'est donc pas dans ses journaux. Il est transmis uniquement au cadre, donc à Google.
-->
<iframe id="appli" title="Séminaires MF-IDF" allow="clipboard-write"></iframe>
<script>
  var WEB_APP = 'https://script.google.com/macros/s/AKfycbz2UNNJclcFtpuIjcyrc48ED18sReg1uDxyOqhqov5f42n85x76KuCMnNdugtRBMcc5/exec';
  // Tous les paramètres de la requête (?t=…&page=…&…) et du fragment (#t=…) sont transmis tels quels au cadre :
  // les futurs liens (annulation, etc.) passent sans retoucher cette page. Le fragment l'emporte sur la requête.
  var params = new URLSearchParams(location.search);
  new URLSearchParams(location.hash.replace(/^#/, '')).forEach(function (v, k) { params.set(k, v); });
  var q = params.toString();
  document.getElementById('appli').src = WEB_APP + (q ? '?' + q : '');
</script>
</body>
</html>
